<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>😍</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- Пароль -->
  <div id="password-screen" class="screen active">
    <h1>Небольшой интерактив</h1>
    <p>Хеллоу 😎 Пока ты чиллишь в больничке, отгадай загадку, которая состоит из 3 частей. Чтобы начать, введи пароль, который указан на QR коде:</p> 
    <input type="password" id="password-input" />
    <button onclick="checkPassword()">Войти</button>
    <p id="password-error" class="error"></p>
  </div>

  <!-- Загадки -->
  <div id="quiz-screen" class="screen">
    <div id="date-progress">
      <span id="day">_</span><span id="month">_</span><span id="year">__</span>
    </div>

    <img id="question-image" alt="" />

    <h2 id="question-title"></h2>
    <input type="text" id="answer-input" autocomplete="off" />
    <button onclick="submitAnswer()">Ответить</button>
    <p id="answer-error" class="error"></p>
  </div>

  <!-- Финал -->
  <div id="final-screen" class="screen">
    <h1 id="final-name">СОНЯ</h1>
    <img src="SONYA_FINAL.png" alt="" id="final-picture" />
    <div id="final-text-container">
      <p class="final-line final-date">Самая красивая пациентка больницы Павлова of all time for sure</p>
      <p class="final-line"><strong>Восстанавливайся скорее</strong></p>
      <p class="final-line">Все будет чики-бомбони 😎</p>
    </div>

    <img src="hedgehog.png" alt="hedgehog" id="final-hedgehog" />
  </div>

</div>

<div id="overlay"></div>

<script src="script.js"></script>
</body>
</html>
